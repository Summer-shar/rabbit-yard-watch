name: iOS and watchOS Simulator Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run shared core tests
        run: swift test --package-path BunnyCore
      - name: Build iOS Simulator app
        run: |
          xcodebuild -project RabbitMoodCompanion.xcodeproj \
            -scheme RabbitMoodCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build watchOS Simulator app
        run: |
          xcodebuild -project RabbitMoodCompanion.xcodeproj \
            -scheme WatchProbe \
            -sdk watchsimulator \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPhone simulator and capture screenshot
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone 16 Pro \(' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone.*\(' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-iphonesimulator/RabbitMoodCompanion.app' -print -quit)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.summershar.RabbitMoodCompanion
          sleep 5
          mkdir -p preview
          xcrun simctl io "$DEVICE_ID" screenshot preview/iphone-simulator.png
      - name: Boot Apple Watch simulator and capture WatchProbe screenshot
        run: |
          WATCH_ID=$(xcrun simctl list devices available | grep -m 1 -E 'Apple Watch Series 10 \(' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          if [ -z "$WATCH_ID" ]; then
            WATCH_ID=$(xcrun simctl list devices available | grep -m 1 -E 'Apple Watch.*\(' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          if [ -z "$WATCH_ID" ]; then
            echo "No watchOS simulator device found."
            exit 1
          fi
          xcrun simctl boot "$WATCH_ID" || true
          xcrun simctl bootstatus "$WATCH_ID" -b
          WATCH_APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug-watchsimulator/WatchProbe.app' -print -quit)
          test -n "$WATCH_APP"
          /usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH_APP/Info.plist"
          xcrun simctl install "$WATCH_ID" "$WATCH_APP"
          xcrun simctl launch "$WATCH_ID" com.summershar.RabbitMoodCompanion.WatchProbe
          sleep 5
          mkdir -p preview
          xcrun simctl io "$WATCH_ID" screenshot preview/watch-simulator.png
      - name: Upload simulator previews and app builds
        uses: actions/upload-artifact@v4
        with:
          name: rabbit-companion-ios-watchos-preview
          path: |
            preview/*.png
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/RabbitMoodCompanion.app
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-watchsimulator/WatchProbe.app
          if-no-files-found: error
