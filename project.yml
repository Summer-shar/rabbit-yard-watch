name: RabbitMoodCompanion
options:
  bundleIdPrefix: com.summershar
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BunnyCore:
    path: BunnyCore
targets:
  RabbitMoodCompanion:
    type: application
    platform: iOS
    sources:
      - path: iOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.summershar.RabbitMoodCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "兔兔陪伴"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: BunnyCore
